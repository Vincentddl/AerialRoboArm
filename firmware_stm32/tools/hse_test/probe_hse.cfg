# Run after daplink.cfg. Tests HSE without writing Flash or changing GPIO.
init
halt
set cfgr [mrw 0x40021004]
if {($cfgr & 0x0c) != 0} {
    resume
    error "HSE test requires CPU to be using HSI; no clock changes made"
}
echo HSE_BEFORE
mdw 0x40021000 2
# Clear HSEON, HSEBYP and CSSON, then enable crystal mode.
mmw 0x40021000 0 0x000d0000
sleep 100
mmw 0x40021000 0x00010000 0
for {set i 1} {$i <= 3} {incr i} {
    sleep 1000
    echo "HSE_AFTER_${i}S"
    mdw 0x40021000 2
}
resume
shutdown
