# J-Link + OpenOCD persistent RTT server for AerialRoboArm.
# Run this after programming. It resets and runs the firmware, then exposes
# RTT up-channel 0 on TCP 127.0.0.1:9090 until Ctrl+C is pressed.

tcl_port disabled
gdb_port disabled
telnet_port disabled

adapter driver jlink
transport select swd

set FLASH_SIZE 0x10000
source [find target/stm32f1x.cfg]

adapter speed 500

init
reset run

# Allow the application to initialize SEGGER RTT before scanning SRAM.
sleep 3000
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start

rtt server start 9090 0
