# ST-Link + OpenOCD persistent RTT server for AerialRoboArm.
# Run after programming, then connect to TCP 127.0.0.1:9090.

tcl_port disabled
gdb_port disabled
telnet_port disabled

source [find interface/stlink.cfg]
transport select hla_swd

set FLASH_SIZE 0x10000
source [find target/stm32f1x.cfg]

adapter speed 1000

init
reset run
sleep 1500

rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start
rtt server start 9090 0

# Keep OpenOCD running. Stop it with Ctrl+C after the test.
