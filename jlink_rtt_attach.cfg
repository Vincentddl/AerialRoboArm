# J-Link + OpenOCD RTT attach-only server for AerialRoboArm.
# This file does not flash, reset, halt, or explicitly run the target.
# Use it while firmware is already running, then connect an RTT client to
# TCP 127.0.0.1:9090. Stop OpenOCD with Ctrl+C.

tcl_port disabled
gdb_port disabled
telnet_port disabled

adapter driver jlink
transport select swd

set FLASH_SIZE 0x10000
source [find target/stm32f1x.cfg]

adapter speed 500

init
sleep 1000

# Scan all SRAM instead of relying on one link-time address.
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start

rtt server start 9090 0
