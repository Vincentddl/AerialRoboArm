# J-Link + OpenOCD base configuration for AerialRoboArm (STM32F103C8T6).
# This file only describes the probe and target. Programming commands are
# supplied by CLion or tools/flash_jlink.ps1.

adapter driver jlink
transport select swd

# STM32F103C8T6: 64 KiB Flash.
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

# Conservative speed for the current J-Link ARM-OB probe.
adapter speed 500
