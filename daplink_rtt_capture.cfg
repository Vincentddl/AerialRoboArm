# 9090: VOFA console on RTT 0; 9091: timestamped experiment data on RTT 1.
source [file join [file dirname [info script]] daplink_rtt_attach.cfg]
# Compact IMU transport fits the 20 ms drain interval. Avoid aggressive 2 ms
# HID polling: this DAPLink showed USB I/O failures during sustained capture.
rtt polling_interval 20
rtt server start 9091 1
