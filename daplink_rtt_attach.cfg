# DAPLink + OpenOCD RTT attach-only server for AerialRoboArm (STM32F103C8T6)
# This config does NOT flash, reset, halt, or run the target.
# Use it only after the firmware is already running from Flash.
# Connect VOFA+ / PuTTY / telnet to 127.0.0.1:9090.

tcl_port disabled
gdb_port disabled
telnet_port disabled

adapter driver cmsis-dap
transport select swd

# STM32F103C8T6: 64K Flash, 20K SRAM.
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

adapter speed 4000

init

# No reset here. BOOT0 may be unstable on current PCB bring-up, so resetting
# while starting RTT can sample BOOT0 high and enter ROM bootloader.
sleep 1000

# Search the whole SRAM range: 0x20000000..0x20004fff.
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start

# Expose RTT up-channel 0 as a local TCP server.
rtt server start 9090 0

# NOTE: no 'shutdown' here. Stop it with Ctrl+C when you are done.
