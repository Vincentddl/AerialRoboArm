# DAPLink + OpenOCD RTT server for AerialRoboArm (STM32F103C8T6)
# Disable command/debug ports before init; RTT is exposed on TCP 9090 below.
tcl port disabled
gdb port disabled
telnet port disabled

adapter driver cmsis-dap
transport select swd

# STM32F103C8T6: 64K Flash, 20K SRAM.
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

# Use the same verified speed as programming; continuous 4 MHz polling has
# caused this DAPLink to reset/disconnect from USB.
adapter speed 1000

init

# Search the whole SRAM range: 0x20000000..0x20004fff.
# Current _SEGGER_RTT was observed around 0x20002760.
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 20
rtt start

# Expose RTT channel 0 as a local TCP server.
# Connect with PuTTY/MobaXterm/VOFA+/telnet to 127.0.0.1:9090.
rtt server start 9090 0
