<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1470" viewBox="0 0 2040 1470">
<rect width="100%" height="100%" fill="white"/>
<text x="1020" y="62" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#203044">机械臂控制系统软件分层架构</text>
<text x="1020" y="119" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596979">正式 FreeRTOS 构建 · 任务编排与顺序控制函数分开表达</text>
<rect x="70" y="190" width="1510" height="145" rx="10" fill="#ffffff" stroke="#315680" stroke-width="2"/>
<text x="180" y="262.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#315680">APP</text>
<rect x="295" y="205" width="1265" height="115" rx="10" fill="#f4f7fb" stroke="#315680" stroke-width="2"/>
<text x="927.5" y="224.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#315680">应用任务与调度</text>
<text x="927.5" y="262.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">ControlTask 20 ms  ·  DebugTask 100 ms</text>
<text x="927.5" y="300.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">TofTask 独立采样  ·  defaultTask 维护与条件喂狗</text>
<rect x="70" y="395" width="1510" height="160" rx="10" fill="#ffffff" stroke="#315680" stroke-width="2"/>
<text x="180" y="475.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#315680">TASK</text>
<rect x="295" y="410" width="1265" height="130" rx="10" fill="#f4f7fb" stroke="#315680" stroke-width="2"/>
<text x="927.5" y="437.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#315680">控制步骤与状态机</text>
<text x="927.5" y="475.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">TaskRc → TaskVision → TaskArbiter → TaskManipulator → TaskMotion</text>
<text x="927.5" y="513.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">以上为 ControlTask 顺序调用的功能步骤，并非五个独立线程</text>
<rect x="70" y="615" width="1510" height="145" rx="10" fill="#ffffff" stroke="#315680" stroke-width="2"/>
<text x="180" y="687.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#315680">MOD</text>
