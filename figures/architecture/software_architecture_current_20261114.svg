<text x="927.5" y="687.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">mod_rc_semantic  ·  mod_startup_angle  ·  mod_home_zero</text>
<text x="927.5" y="725.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#203044">mod_position_trim  ·  调试请求处理</text>
