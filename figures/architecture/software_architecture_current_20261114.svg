<text x="1810.0" y="1007.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#203044">当前不直接驱动夹爪</text>
<text x="1020" y="1390" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#596979">已移除旧图中的 alg_pid / alg_voltage_foc / drv_as5600 / drv_bldc_power；主臂闭环由 HX8 内部完成。</text>
<text x="1020" y="1435" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#596979">JY61P 与 HC13 V2 实验采集路径单独构建，不并入本图的正式任务结构。</text>
