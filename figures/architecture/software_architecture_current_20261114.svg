<text x="1810.0" y="527.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#203044">ControlTask 单写者</text>
<text x="1810.0" y="565.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#203044">多读者状态快照</text>
