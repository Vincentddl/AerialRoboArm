# J-Link + OpenOCD RTT server for AerialRoboArm (STM32F103C8T6).
# The target is attached without an explicit reset. RTT channel 0 is exposed
# on TCP 127.0.0.1:9090 until OpenOCD is stopped with Ctrl+C.

tcl_port disabled
gdb_port disabled
telnet_port disabled

adapter driver jlink
transport select swd

set FLASH_SIZE 0x10000
source [find target/stm32f1x.cfg]

# Conservative speed for the current J-Link ARM-OB probe.
adapter speed 500

init

# Scan all 20 KiB of SRAM so this remains valid if a rebuild moves
# _SEGGER_RTT. It was observed at 0x200027e0 in the current firmware.
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start

rtt server start 9090 0
