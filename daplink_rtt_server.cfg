# DAPLink + OpenOCD persistent RTT server for AerialRoboArm (STM32F103C8T6)
# This config does NOT flash and does NOT shut down. Run it AFTER programming.
# It resets/runs the firmware, then keeps an RTT TCP server alive on port 9090.
# Connect VOFA+ / PuTTY / telnet to 127.0.0.1:9090.

tcl_port disabled
gdb_port disabled
telnet_port disabled

adapter driver cmsis-dap
transport select swd

# STM32F103C8T6: 64K Flash, 20K SRAM.
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

adapter speed 4000

init

# Let the firmware run so it executes SEGGER_RTT_Write at least once.
# The _SEGGER_RTT control block is created lazily on the first RTT write,
# so it does not exist in RAM until the application has run.
reset run

# Give the firmware time to boot and emit its first RTT log.
sleep 3000

# Search the whole SRAM range: 0x20000000..0x20004fff.
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt polling_interval 10
rtt start

# Expose RTT up-channel 0 as a local TCP server.
rtt server start 9090 0

# NOTE: no 'shutdown' here. OpenOCD stays running and keeps polling RTT.
# Stop it with Ctrl+C when you are done.
